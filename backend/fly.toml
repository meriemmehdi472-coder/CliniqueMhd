app = "clinique-mhd-backend"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  RAILS_LOG_TO_STDOUT = "true"
  BINDING = "0.0.0.0"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/up"
    method = "GET"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
