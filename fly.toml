app = "cliniquemhd-prod"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  RAILS_LOG_TO_STDOUT = "true"
  PORT = "3000"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "40s"
    interval = "15s"
    method = "GET"
    path = "/up"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"


